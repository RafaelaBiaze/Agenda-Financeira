version: '3.8'

services:
  db:
    image: postgres:15
    container_name: agenda_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      TZ: 'America/Sao_Paulo'
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    container_name: agenda_backend
    restart: always
    volumes:
      - .:/app
      - /app/node_modules # Impede que o Windows sobrescreva os módulos do Docker
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@db:${PG_PORT}/${PG_DB}
      PORT: 3333
    networks:
      - backend_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: agenda_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/manutencao.html:/usr/share/nginx/html/manutencao.html:ro
    networks:
      - frontend_network
      - backend_network
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: agenda_frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - frontend_network
    depends_on:
      - backend
        
volumes:
  postgres_data:

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge