version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agenda_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      TZ: 'America/Sao_Paulo'
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Healthcheck Inteligente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s # Grace Period para não matar o banco enquanto ele liga

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: agenda_backend
    restart: always
    volumes:
      - ./Backend/uploads:/app/uploads # Apenas a pasta de comprovantes deve persistir
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@db:${PG_PORT:-5432}/${PG_DB}
      PORT: 3333
    networks:
      - backend_network
    depends_on:
      db:
        condition: service_healthy # O Backend SÓ liga se o Banco passar no healthcheck
    # Healthcheck da API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenda_frontend
    restart: always
    networks:
      - frontend_network

  nginx:
    image: nginx:alpine
    container_name: agenda_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Backend/nginx/manutencao.html:/usr/share/nginx/html/manutencao.html:ro
    networks:
      - frontend_network
      - backend_network
    depends_on:
      backend:
        condition: service_healthy # O Proxy central só sobe quando a API estiver 100% pronta

volumes:
  postgres_data:

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge